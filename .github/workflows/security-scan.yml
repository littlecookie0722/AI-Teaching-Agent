name: Security Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-release-scan:
    name: Tracked release tree scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install scanner test dependency
        run: python -m pip install --disable-pip-version-check "pytest>=8.3,<10"

      - name: Run repository security scan
        run: python scripts/security_scan.py

      - name: Run security scanner tests
        run: python -m pytest tests/test_security_scan.py -q
