[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-teaching-agent"
version = "0.1.8"
description = "Review-gated AI workflows for teaching labs, exams, grading, and presentation plans."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "littlecookie" },
]
keywords = [
  "ai-agent",
  "automated-grading",
  "education",
  "human-in-the-loop",
  "mcp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
]
llm = [
  "openai>=1.0.0,<2.0.0",
]
postgres = [
  "psycopg[binary]>=3.1,<4.0",
]
mysql = [
  "mysql-connector-python>=8.0,<10.0",
]

[project.scripts]
ai-teaching-agent = "cli.console:main"

[project.urls]
Homepage = "https://github.com/littlecookie0722/AI-Teaching-Agent"
Issues = "https://github.com/littlecookie0722/AI-Teaching-Agent/issues"
Repository = "https://github.com/littlecookie0722/AI-Teaching-Agent.git"

[tool.setuptools]
include-package-data = false
py-modules = ["lab_cli"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "agents*",
  "ai-workflows*",
  "ai_workflows*",
  "backend*",
  "cli*",
  "config*",
  "evals*",
  "examples.input*",
  "examples.notebooks*",
  "examples.submissions*",
  "frontend*",
  "materials*",
  "mcp_server*",
  "mcp-server*",
  "prompts*",
  "providers*",
  "quality*",
  "scripts*",
  "sandbox*",
  "templates*",
]
exclude = [
  "tests*",
  "examples.output*",
]
namespaces = true

[tool.setuptools.package-data]
"*" = [
  "*.html",
  "*.ipynb",
  "*.js",
  "*.json",
  "*.md",
  "*.mjs",
  "*.txt",
  "*.yaml",
  "*.yml",
]
sandbox = [
  "images/python-pytest/Dockerfile",
  "images/python-pytest/README.md",
]
