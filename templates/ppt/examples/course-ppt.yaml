version: "1.0"
kind: "PPT"
metadata:
  id: "ppt_demo"
  title: "AI 工具应用课程"
  audience: "学生"
  durationMinutes: 45
status: "WAITING_REVIEW"
spec:
  theme:
    style: "modern"
    language: "zh-CN"
  slides:
    - id: "slide_1"
      type: "title"
      layout: "hero"
      title: "AI 工具应用课程"
      subtitle: "从学习目标到可复现实践"
    - id: "slide_2"
      type: "content"
      layout: "objectives"
      title: "学习目标"
      bullets:
        - "理解 AI 工具的基本用途"
        - "掌握 DSL 到 CLI 的基础流程"
        - "了解人工审核的重要性"
    - id: "slide_3"
      type: "content"
      layout: "concept"
      title: "核心概念"
      bullets:
        - "结构化 DSL 让教学内容可校验"
        - "统一 CLI 契约让流程可复现"
        - "人工审核负责最终教学判断"
    - id: "slide_4"
      type: "content"
      layout: "process"
      title: "实验步骤"
      bullets:
        - "阅读 Markdown 教学材料"
        - "生成并校验教学 DSL"
        - "运行本地命令并记录结果"
        - "根据反馈修订产物"
    - id: "slide_5"
      type: "content"
      layout: "exercise"
      title: "课堂练习"
      bullets:
        - "说明 DSL 校验失败时的排查顺序"
        - "列出一次人工审核应关注的三项证据"
        - "用自己的语言总结安全边界"
    - id: "slide_6"
      type: "summary"
      layout: "summary"
      title: "总结与下一步"
      bullets:
        - "先建立结构，再运行工具"
        - "保留校验和可复现证据"
        - "审核通过后再进入后续使用"
